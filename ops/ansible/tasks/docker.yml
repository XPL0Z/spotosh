# Docker Engine from Docker's official apt repository (Debian / Ubuntu)
- name: Install apt prerequisites
  become: true
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    update_cache: true

- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt key
  become: true
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
      {{ ansible_facts.distribution_release }} stable
    filename: docker

- name: Install Docker Engine and compose plugin
  become: true
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    update_cache: true

- name: Enable Docker service
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Let the deploy user run Docker
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Reconnect so the docker group applies
  ansible.builtin.meta: reset_connection
